    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AuthFlow - Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard-container">

        <header class="dashboard-header">

            <div class="dashboard-brand">
                <div class="brand-icon small">✓</div>

                <span>AuthFlow</span>
            </div>


            <button
                id="logoutBtn"
                class="logout-btn"
            >
                Logout
            </button>

        </header>


        <main class="dashboard-content">

            <div class="welcome-card">

                <div class="success-icon">
                    ✓
                </div>

                <p class="dashboard-label">
                    PROTECTED DASHBOARD
                </p>

                <h1>
                    Welcome,
                    <span id="dashboardUsername">
                        User
                    </span>!
                </h1>

                <p>
                    You have successfully logged in.
                    This page is protected and can only be
                    accessed by authenticated users.
                </p>

                <div class="user-info">

                    <div class="info-item">
                        <span>Username</span>
                        <strong id="userUsername">-</strong>
                    </div>

                    <div class="info-item">
                        <span>Email</span>
                        <strong id="userEmail">-</strong>
                    </div>

                </div>

            </div>

        </main>

    </div>


    <script src="script.js"></script>

</body>
</html>

</body>
</html>
